<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Ночная волейбольная площадка «Авангард»</title>
  <desc id="desc">Абстрактная ледяно-синяя сцена с площадкой, сеткой и траекторией мяча.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">

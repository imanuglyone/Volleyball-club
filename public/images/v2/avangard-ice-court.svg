      <stop offset=".58" stop-color="#0D1320"/>
      <stop offset="1" stop-color="#152447"/>
    </linearGradient>
    <radialGradient id="beam" cx=".66" cy=".32" r=".62">
      <stop stop-color="#A7D8FF" stop-opacity=".38"/>
      <stop offset=".36" stop-color="#4D6BFF" stop-opacity=".17"/>
      <stop offset="1" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1=".2" y1="0" x2=".8" y2="1">
